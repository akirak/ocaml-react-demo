# This file is largely based on https://github.com/melange-re/melange-nextjs-starter/blob/master/process-compose.yaml
# written by Antonio Nuno Monteiro
version: "0.5"
is_strict: true

processes:
  install:
    command: pnpm install
    availability:
      restart: "no"
  melange:
    command: dune build @melange --watch --auto-promote
    depends_on:
      install:
        condition: process_completed_successfully
  vite:
    command: bash -lc 'while [ ! -f _build/default/app/app/client/App.js ]; do sleep 0.2; done; pnpm run dev'
    depends_on:
      install:
        condition: process_completed_successfully
      melange:
        condition: process_started
  server:
    command: dune exec --build-dir _build-server --watch react_demo
    environment:
      - "CLIENT_ENTRYPOINT=${CLIENT_ENTRYPOINT:-http://localhost:5173/main.js}"
      - "PORT=${PORT:-8000}"
    depends_on:
      melange:
        condition: process_started
      vite:
        condition: process_started
